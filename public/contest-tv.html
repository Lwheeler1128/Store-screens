<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Contest (TV)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Barlow","Segoe UI",system-ui,sans-serif}
  .tv{width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;position:relative;box-sizing:border-box;
      background:radial-gradient(120% 90% at 100% 0%,#1B2F57 0%,#0B1426 60%);color:#F2F5FA;padding:2.6cqw 3.2cqw 2cqw;display:flex;flex-direction:column;gap:1.4cqw}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
  .kicker{font-size:1.15cqw;letter-spacing:.2em;text-transform:uppercase;color:#A8B6CF;font-weight:700;margin-bottom:.4cqw}
  h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:4.2cqw;line-height:.9;text-transform:uppercase}
  h1 span{color:#F6B221}
  .weeks{display:flex;gap:.6cqw}
  .wk{border:.12cqw solid rgba(255,255,255,.15);border-radius:.7cqw;padding:.45cqw .9cqw;min-width:8cqw}
  .wk b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.5cqw;line-height:1.1}
  .wk small{font-size:.95cqw;color:#7F8FAD}
  .wk.done{border-color:#F6B221;background:rgba(246,178,33,.12)} .wk.done small{color:#F6C46A}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:.82fr 1.5fr;gap:1.4cqw}
  .left{display:flex;flex-direction:column;gap:1cqw;min-height:0;overflow:hidden}
  .sec{font-size:1.05cqw;letter-spacing:.16em;text-transform:uppercase;color:#7F8FAD;font-weight:700}
  .pods{display:grid;grid-template-columns:1fr;gap:.8cqw}
  .pod{display:grid;grid-template-columns:5.5cqw 1fr auto;align-items:center;gap:1cqw;background:rgba(255,255,255,.06);border-radius:1cqw;padding:.6cqw 1.3cqw;border-left:.5cqw solid}
  .pod .pl{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.2cqw;text-transform:uppercase}
  .pod .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.2cqw;line-height:1}
  .pod .st{font-size:1.05cqw;color:#A8B6CF}
  .pod .t{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:3.2cqw;font-variant-numeric:tabular-nums}
  .p1{border-color:#E0B440}.p1 .pl{color:#E0B440}
  .p2{border-color:#A9B5C2}.p2 .pl{color:#A9B5C2}
  .p3{border-color:#CF8A57}.p3 .pl{color:#CF8A57}
  .stores{display:flex;flex-direction:column;gap:.45cqw;flex:1;min-height:0}
  .srow{flex:1 1 0;min-height:0;max-height:3.4cqw;display:grid;grid-template-columns:2.4cqw 1fr auto auto auto;align-items:center;gap:1cqw;background:rgba(255,255,255,.05);border-radius:.6cqw;padding:0 1cqw;font-size:1.5cqw}
  .srow .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:#7F8FAD}
  .srow b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.7cqw}
  .srow .c{white-space:nowrap;font-size:.95cqw;color:#7F8FAD}
  .srow .t{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.8cqw;font-variant-numeric:tabular-nums}
  .srow.first{background:rgba(246,178,33,.16)}
  .right{display:flex;flex-direction:column;gap:.5cqw;min-height:0}
  .cols,.mrow{display:grid;grid-template-columns:calc(var(--fs)*2) calc(var(--fs)*1.8) minmax(0,1.45fr) minmax(0,.8fr) var(--wk) calc(var(--fs)*3.2) calc(var(--fs)*3.2);column-gap:calc(var(--fs)*.7);align-items:center}
  .cols{font-size:.95cqw;letter-spacing:.12em;text-transform:uppercase;color:#7F8FAD;font-weight:700;padding:0 calc(var(--fs)*.6)}
  .cols span:nth-child(n+5){text-align:right}
  .cols .mvh{text-align:center}
  .wkc{display:flex;justify-content:flex-end;gap:calc(var(--fs)*.6);font-size:calc(var(--fs)*.9);color:#A8B6CF;font-variant-numeric:tabular-nums}
  .cols .wkc{color:inherit;font-size:inherit;white-space:nowrap}
  .cols span{white-space:nowrap}
  .mrow .mv{text-align:center;font-weight:700;color:#7F8FAD;font-size:calc(var(--fs)*.85)}
  .mrow .mv.new{color:#F6C46A;font-size:calc(var(--fs)*.7);letter-spacing:.04em}
  .mrow .mv.up{color:#5CCF83} .mrow .mv.dn{color:#F2857B}
  .srow .w{white-space:nowrap;font-size:.95cqw;color:#A8B6CF;font-variant-numeric:tabular-nums}
  .mrows{display:flex;flex-direction:column;gap:calc(var(--fs)*.18);flex:1;min-height:0}
  .mrow{flex:1 1 0;min-height:0;max-height:calc(var(--fs)*2.4);background:rgba(255,255,255,.05);border-radius:calc(var(--fs)*.3);padding:0 calc(var(--fs)*.6);font-size:var(--fs);line-height:1;overflow:hidden}
  .mrow .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:#7F8FAD;text-align:center}
  .mrow .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .st{color:#A8B6CF;font-size:calc(var(--fs)*.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .t{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:calc(var(--fs)*1.2);text-align:right;font-variant-numeric:tabular-nums}
  .mrow .g{color:#7F8FAD;text-align:right;font-variant-numeric:tabular-nums}
  .mrow.top{background:rgba(246,178,33,.14)} .mrow.top .n{color:#F6B221}
  .gmc{display:flex;align-items:baseline;gap:.9cqw;white-space:nowrap;overflow:hidden;padding:.5cqw 1.3cqw;border-radius:.8cqw;background:rgba(246,178,33,.08);border:.12cqw solid rgba(246,178,33,.35);font-size:1.05cqw;color:#A8B6CF}
  .gmc:empty{display:none}
  .gmc .k{letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#F6C46A}
  .gmc b{font-family:"Barlow Condensed",sans-serif;font-size:1.8cqw;color:#F2F5FA}
  .gmc .t{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2cqw;color:#F2F5FA;margin-left:auto}
  .gmtag{font-size:calc(var(--fs)*.6);font-weight:700;letter-spacing:.06em;padding:0 .35em;border-radius:.25em;background:rgba(246,178,33,.2);color:#F6C46A;margin-left:.4em;vertical-align:.15em}
  .foot{display:flex;justify-content:space-between;font-size:1.05cqw;color:#7F8FAD}
</style>
</head>
<body>
<div class="tv">
  <div class="head">
    <div><div class="kicker" id="kicker">5-store contest · lower time wins</div><h1>Drive-Thru <span>Speed Contest</span></h1></div>
    <div class="weeks" id="weeks"></div>
  </div>
  <div class="main">
    <div class="left">
      <div class="sec">Prize leaders</div>
      <div class="pods" id="pods"></div>
      <div class="gmc" id="gmc"></div>
      <div class="sec" id="ssec">Store standings</div>
      <div class="stores" id="stores"></div>
    </div>
    <div class="right" id="right">
      <div class="cols" id="cols"></div>
      <div class="mrows" id="mrows"></div>
    </div>
  </div>
  <div class="foot"><span>Col O: lane total with pull-forward, car-weighted. 4-day minimum every week to place. GMs aren't prize-eligible.</span><span id="note"></span></div>
</div>
<script src="/contest-data.js"></script>
<script>
const C = window.CONTEST, fmt = C.fmt, esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const { mgrs, stores } = C.combine("all");
  const ranked = mgrs.filter(r => r.ok), out = mgrs.length - ranked.length, W = C.WEEKS.length, multi = W > 1;
  document.getElementById("kicker").textContent = (W >= C.totalWeeks ? "Final standings · " + W + "-week average" : multi ? "Overall standings · " + W + "-week average" : "Contest to date") + " · lower time wins";
  document.getElementById("weeks").innerHTML = Array.from({ length: C.totalWeeks }, (_, i) => { const w = C.WEEKS[i];
    return `<div class="wk ${w ? "done" : ""}"><b>Week ${i + 1}</b><small>${w ? esc(w.dates) : "Coming up"}</small></div>`; }).join("");
  const wkTimes = r => multi ? `<span class="wkc">${C.WEEKS.map((w, i) => `<span>${r.times[i] != null ? fmt(r.times[i]) : "—"}</span>`).join("")}</span>` : `<span></span>`;
  const pl = ["1st", "2nd", "3rd"];
  document.getElementById("ssec").textContent = multi ? "Store standings · " + C.WEEKS.map((w, i) => "Wk " + (i + 1)).join(" · ") : "Store standings";
  const prizeRows = ranked.filter(r => !C.isGM(r.name)), gmTop = ranked.find(r => C.isGM(r.name));
  document.getElementById("gmc").innerHTML = gmTop ? `<span class="k">Fastest GM</span><b>${esc(gmTop.name)}</b><span>#${ranked.indexOf(gmTop) + 1} overall</span><span class="t">${fmt(gmTop.time)}</span>` : "";
  document.getElementById("pods").innerHTML = prizeRows.slice(0, 3).map((r, i) =>
    `<div class="pod p${i + 1}"><div class="pl">${pl[i]}</div><div><div class="nm">${esc(r.name)}</div><div class="st">${esc(r.store)} · ${r.cars.toLocaleString()} cars</div></div><div class="t">${fmt(r.time)}</div></div>`).join("");
  document.getElementById("stores").innerHTML = stores.map((s, i) =>
    `<div class="srow ${i === 0 ? "first" : ""}"><span class="n">${i + 1}</span><b>${esc(s.name.replace(/\s*#\d+$/,''))}</b><span class="w">${multi ? C.WEEKS.map((w, k) => s.times[k] != null ? fmt(s.times[k]) : "—").join(" · ") : ""}</span><span class="c">${s.cars.toLocaleString()} cars</span><span class="t">${fmt(s.time)}</span></div>`).join("");
  // size the manager list so every qualified manager fits
  const N = ranked.length, fs = Math.min(1.7, 40 / N / 1.25), right = document.getElementById("right");
  right.style.setProperty("--fs", fs.toFixed(3) + "cqw");
  right.style.setProperty("--wk", multi ? `calc(var(--fs) * ${(W * 2.35).toFixed(1)})` : "0px");
  document.getElementById("cols").innerHTML = `<span>#</span><span class="mvh">${multi ? "Move" : ""}</span><span>Manager</span><span>Store</span>` +
    (multi ? `<span class="wkc">${C.WEEKS.map((w, i) => `<span>Wk ${i + 1}</span>`).join("")}</span>` : `<span></span>`) +
    `<span>${multi ? W + "-Wk" : "Col O"}</span><span>Behind</span>`;
  const mv = C.moves(ranked);
  const moveTxt = r => { const d = mv[r.name]; return d === undefined ? `<span class="mv"></span>` : d === "new" ? `<span class="mv new">New</span>` : d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv dn">▼${-d}</span>` : `<span class="mv">–</span>`; };
  const lead = ranked[0] ? Math.round(ranked[0].time) : 0;
  document.getElementById("mrows").innerHTML = ranked.map((r, i) =>
    `<div class="mrow ${prizeRows.indexOf(r) > -1 && prizeRows.indexOf(r) < 3 ? "top" : ""}"><span class="n">${i + 1}</span>${moveTxt(r)}<span class="who">${esc(r.name)}${C.isGM(r.name) ? '<span class="gmtag">GM</span>' : ""}</span><span class="st">${esc(r.store.replace("Moncks Corner + Tanger","Moncks + Tanger").replace("Moncks Corner","Moncks").replace("Dorchester → Tanger","Dorch → Tanger"))}</span>${wkTimes(r)}<span class="t">${fmt(r.time)}</span><span class="g">${i && Math.round(r.time) > lead ? "+" + fmt(Math.round(r.time) - lead) : "—"}</span></div>`).join("");
  document.getElementById("note").textContent = out ? `${out} manager${out > 1 ? "s" : ""} not qualified` : "";
}
render();
</script>
</body>
</html>
