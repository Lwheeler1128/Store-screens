<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Reviews</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Barlow","Segoe UI",system-ui,sans-serif}
  .tv{width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;position:relative;background:radial-gradient(120% 90% at 0% 0%,#1B2F57 0%,#0B1426 60%);color:#F2F5FA;padding:3cqw 3.6cqw 2.4cqw;box-sizing:border-box;display:flex;flex-direction:column;gap:1.8cqw}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
  .kicker{font-size:1.25cqw;letter-spacing:.2em;text-transform:uppercase;color:#A8B6CF;font-weight:700;margin-bottom:.5cqw}
  h1{margin:0;font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:4.6cqw;line-height:.92;text-transform:uppercase}
  h1 span{color:#F6B221}
  .score{text-align:right;line-height:1}
  .score b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:5.4cqw;color:#fff}
  .score .st{font-size:2.2cqw;color:#F6B221;letter-spacing:.08em;display:block;margin:.3cqw 0}
  .score small{font-size:1.25cqw;color:#A8B6CF}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:1.4cqw}
  .card{position:relative;background:rgba(255,255,255,.06);border:.12cqw solid rgba(255,255,255,.09);border-radius:1.2cqw;padding:1.6cqw 1.8cqw;display:flex;flex-direction:column;gap:.9cqw;min-height:0;overflow:hidden}
  .card.big{grid-row:1/3;background:linear-gradient(160deg,rgba(246,178,33,.2),rgba(246,178,33,.04));border-color:rgba(246,178,33,.55)}
  .stars{color:#F6B221;font-size:1.9cqw;letter-spacing:.1em;line-height:1}
  .stars i{color:rgba(255,255,255,.2);font-style:normal}
  .big .stars{font-size:2.8cqw}
  .text{font-size:1.45cqw;line-height:1.35;color:#E8EDF6;font-weight:500;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
  .all .card:not(.big) .text{-webkit-line-clamp:4}
  .big .text{font-size:2.3cqw;line-height:1.32;-webkit-line-clamp:9}
  .text::before{content:"\201C"}.text::after{content:"\201D"}
  .who{margin-top:auto;display:flex;align-items:center;gap:.8cqw;font-size:1.2cqw;color:#A8B6CF;font-weight:600;flex-wrap:wrap}
  .who b{color:#fff;font-weight:700}
  .big .who{font-size:1.55cqw}
  .tag{background:rgba(255,255,255,.1);border-radius:2cqw;padding:.15cqw .8cqw;color:#fff;font-size:.95em}
  .new{position:absolute;top:1.2cqw;right:1.2cqw;background:#C8102E;color:#fff;font-weight:800;font-size:1.1cqw;letter-spacing:.12em;padding:.3cqw .9cqw;border-radius:2cqw;animation:pulse 1.8s ease-in-out infinite}
  .big .new{font-size:1.5cqw}
  @keyframes pulse{50%{transform:scale(1.08)}}
  @media (prefers-reduced-motion:reduce){.new{animation:none}}
  .foot{display:flex;justify-content:space-between;font-size:1.1cqw;color:#7F8FAD}
  .empty{flex:1;display:grid;place-items:center;font-size:2.2cqw;color:#A8B6CF;text-align:center}
</style>
</head>
<body>
<div class="tv" id="tv">
  <div class="head">
    <div><div class="kicker" id="kicker">Google reviews</div><h1>What our guests <span>are saying</span></h1></div>
    <div class="score" id="score"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span>Reviews from Google</span><span id="upd"></span></div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars=n=>{n=Math.round(n||0);return "★".repeat(n)+`<i>${"★".repeat(5-n)}</i>`};
function ago(t){if(!t)return "";const d=(Date.now()-Date.parse(t))/864e5;
  if(d<1)return "today";if(d<2)return "yesterday";if(d<7)return Math.floor(d)+" days ago";if(d<14)return "last week";if(d<60)return Math.floor(d/7)+" weeks ago";if(d<365)return Math.floor(d/30)+" months ago";return "over a year ago"}
const store=(new URLSearchParams(location.search).get("store")||"all");
async function load(){
  try{
    const d=await (await fetch("/api/reviews?store="+encodeURIComponent(store),{cache:"no-store"})).json();
    document.getElementById("kicker").textContent=d.scope==="store"?d.store+" · Google reviews":"All stores · newest Google reviews";
    document.getElementById("score").innerHTML=d.rating!=null?`<b>${d.rating.toFixed(1)}</b><span class="st">${stars(d.rating)}</span><small>${d.total?d.total.toLocaleString()+" reviews on Google":""}</small>`:"";
    document.getElementById("upd").textContent=d.fetchedAt?"Updated "+new Date(d.fetchedAt).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"}):"";
    document.getElementById("tv").classList.toggle("all",d.scope==="all");
    const g=document.getElementById("grid");
    if(!d.reviews.length){g.outerHTML=`<div class="empty" id="grid">New reviews will show up here.</div>`;return}
    g.innerHTML=d.reviews.map((v,i)=>{const fresh=v.time&&Date.now()-Date.parse(v.time)<48*36e5;
      return `<div class="card ${i===0?"big":""}">${fresh?'<span class="new">NEW</span>':""}
        <div class="stars">${stars(v.rating)}</div>
        <div class="text">${esc(v.text||"(rating only)")}</div>
        <div class="who"><b>${esc(v.author)}</b><span>${esc(ago(v.time))}</span>${v.store?`<span class="tag">${esc(v.store)}</span>`:""}</div></div>`}).join("");
    // fewer than 5 reviews: let the cards fill the space
    const n=d.reviews.length;
    if(n<=3){g.style.gridTemplateRows="1fr";g.style.gridTemplateColumns=n===1?"1fr":n===2?"1.25fr 1fr":"1.25fr 1fr 1fr";g.querySelector(".big").style.gridRow="auto"}
  }catch(e){}
}
load();setInterval(load,10*60*1000);
</script>
</body>
</html>
