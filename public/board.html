<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive-Thru Showdown</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Barlow","Segoe UI",system-ui,sans-serif}
  .tv{width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;position:relative}
  .lb{position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,#1B2F57 0%,#0B1426 60%);color:#F2F5FA;padding:3.2cqw 3.6cqw;display:flex;flex-direction:column;gap:1.6cqw}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
  .title{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:5.4cqw;line-height:.9;text-transform:uppercase;letter-spacing:.01em}
  .title span{color:#F6B221}
  .meta{text-align:right;font-size:1.35cqw;color:#A8B6CF;line-height:1.35}
  .meta b{color:#fff;font-weight:600}
  .cols,.row{display:grid;grid-template-columns:4cqw minmax(0,1fr) 9.5cqw 8cqw 10cqw 6.5cqw 7cqw 7.5cqw;gap:1.3cqw;align-items:center;gap:1.6cqw}
  .cols{font-size:1.1cqw;text-transform:uppercase;letter-spacing:.12em;color:#7F8FAD;font-weight:600;padding:0 1.4cqw}
  .rows{display:flex;flex-direction:column;gap:.8cqw;flex:1;min-height:0}
  .row{background:rgba(255,255,255,.05);border-radius:.9cqw;padding:0 1.4cqw;flex:1;min-height:0;max-height:8.5cqw}
  .row.first{background:linear-gradient(90deg,rgba(246,178,33,.28),rgba(246,178,33,.06));box-shadow:inset 0 0 0 .15cqw rgba(246,178,33,.7)}
  .row.stale{opacity:.45}
  .rank{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:3.4cqw;color:#7F8FAD}
  .first .rank{color:#F6B221}
  .store{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:700;font-size:2.5cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
  .store small{display:block;font-family:"Segoe UI",sans-serif;font-weight:500;font-size:1.1cqw;color:#8E9CB6;letter-spacing:.04em}
  .time{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:3.6cqw;font-variant-numeric:tabular-nums;text-align:right}
  .dp{font-size:1.9cqw;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:#C9D3E4}
  .dp small,.cars small{display:block;font-size:.95cqw;color:#7F8FAD;letter-spacing:.1em;text-transform:uppercase}
  .bar{position:relative;height:1.1cqw;background:rgba(255,255,255,.08);border-radius:1cqw}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:1cqw;transition:width .8s ease}
  .bar .goal{position:absolute;top:-.6cqw;bottom:-.6cqw;width:.2cqw;background:#fff;opacity:.8}
  .live{font-size:2.4cqw;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:#fff}
  .live small{display:block;font-size:.95cqw;color:#7F8FAD;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .flash{animation:flash 1.2s ease-out}
  @keyframes flash{0%{text-shadow:0 0 1.2cqw #F6B221;transform:scale(1.12)}100%{text-shadow:none;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.flash{animation:none}}
  .dotlive{display:inline-block;width:.8cqw;height:.8cqw;border-radius:50%;background:#34C77B;margin-right:.5cqw;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .cars{font-size:1.9cqw;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:#C9D3E4}
  .good{color:#4AD68A}.warn{color:#F4BC4C}.bad{color:#FF6B7E}
  .b-good{background:#34C77B}.b-warn{background:#F4BC4C}.b-bad{background:#FF5A70}
  .foot{display:flex;gap:2.4cqw;font-size:1.15cqw;color:#8E9CB6;align-items:center}
  .foot i{display:inline-block;width:1cqw;height:1cqw;border-radius:.3cqw;margin-right:.5cqw;vertical-align:-.1cqw}
  .foot .sp{flex:1}
  .offline{position:absolute;left:50%;top:1.2cqw;transform:translateX(-50%);background:#FF5A70;color:#fff;font-weight:700;font-size:1.2cqw;padding:.4cqw 1.2cqw;border-radius:2cqw;display:none}
</style>
</head>
<body>
<div class="tv"><div class="lb">
  <div class="head"><div class="title" id="title">Drive-Thru<br><span>Showdown</span></div><div class="meta" id="meta">Connecting…</div></div>
  <div class="cols"><span>#</span><span>Store</span><span style="text-align:right">Today</span><span style="text-align:right">Daypart</span><span>vs. goal</span><span style="text-align:right">Cars</span><span style="text-align:right">In line</span><span style="text-align:right">Window</span></div>
  <div class="rows" id="rows"></div>
  <div class="foot"><span><i class="b-good"></i>At or under goal</span><span><i class="b-warn"></i>Within 30 sec</span><span><i class="b-bad"></i>Over by 30+ sec</span><span class="sp"></span><span id="src"><i class="dotlive"></i>Live from Berry AI</span></div>
</div><div class="offline" id="offline">Feeder not responding</div></div>
<script>
const fmt=s=>s==null?"--":Math.floor(s/60)+":"+String(Math.round(s)%60).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STALE=2*60*1000;const prev={};
async function tick(){
  try{
    const r=await fetch("/api/live",{cache:"no-store"});const d=await r.json();
    document.getElementById("offline").style.display="none";render(d);
  }catch(e){document.getElementById("offline").style.display="block"}
}
function render(d){
  const g=d.goalSeconds;const now=Date.now();
  const band=v=>v==null?"":v<=g?"good":v<=g+30?"warn":"bad";
  const stores=d.stores.map(s=>({...s,age:s.updatedAt?now-Date.parse(s.updatedAt):Infinity}));
  stores.sort((a,b)=>(a.todayAvg??9e9)-(b.todayAvg??9e9));
  const max=Math.max(g+120,...stores.map(s=>s.todayAvg||0));
  const last=Math.max(0,...stores.filter(s=>s.updatedAt).map(s=>Date.parse(s.updatedAt)));
  const dp=(stores.find(s=>s.daypart)||{}).daypart||"";
  document.getElementById("meta").innerHTML=`Avg total time (pull-forward) · today<br>${esc(dp)}<br>Goal <b>${fmt(g)}</b> · updated <b>${last?new Date(last).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"--"}</b>`;
  document.getElementById("rows").innerHTML=stores.map((s,i)=>{const b=band(s.todayAvg);const stale=s.age>STALE;
    return `<div class="row ${i===0&&s.todayAvg!=null?"first":""} ${stale?"stale":""}">
      <div class="rank">${i+1}</div>
      <div class="store">${esc(s.name)}<small>${s.num?"#"+esc(s.num):""}${stale?(s.updatedAt?" · no update in "+Math.round(s.age/60000)+" min":" · waiting for data"):""}&nbsp;</small></div>
      <div class="time ${b}" data-k="${esc(s.code)}-t">${fmt(s.todayAvg)}</div>
      <div class="dp ${band(s.daypartAvg)}">${fmt(s.daypartAvg)}<small>daypart</small></div>
      <div class="bar">${s.todayAvg!=null?`<i class="b-${b}" style="width:${(s.todayAvg/max*100).toFixed(1)}%"></i>`:""}<span class="goal" style="left:${(g/max*100).toFixed(1)}%"></span></div>
      <div class="cars" data-k="${esc(s.code)}-cars">${s.todayCars??"--"}<small>cars</small></div>
      <div class="live" data-k="${esc(s.code)}-q">${s.queue??"--"}<small>in line</small></div>
      <div class="live ${s.windowNow!=null&&s.windowGoal?(s.windowNow<=s.windowGoal?"good":s.windowNow<=s.windowGoal+30?"warn":"bad"):""}" data-k="${esc(s.code)}-w">${s.windowNow?fmt(s.windowNow):"--"}<small>window</small></div>
    </div>`}).join("");
  // flash any number that changed since the last refresh
  document.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k,v=el.firstChild?el.firstChild.textContent:"";
    if(prev[k]!==undefined&&prev[k]!==v){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}prev[k]=v});
}
tick();setInterval(tick,3000);
</script>
</body>
</html>
