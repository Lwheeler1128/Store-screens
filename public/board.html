<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive-Thru Showdown</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Barlow","Segoe UI",system-ui,sans-serif}
  .tv{width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;position:relative}
  .lb{--fs:2.6cqw;position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,#1B2F57 0%,#0B1426 60%);color:#F2F5FA;padding:3.2cqw 3.6cqw;display:flex;flex-direction:column;gap:1.6cqw}
  .head{display:flex;align-items:center;justify-content:space-between;gap:2cqw}
  .title{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:var(--title,5.4cqw);line-height:.9;text-transform:uppercase;letter-spacing:.01em}
  .title span{color:#F6B221}
  .meta{text-align:right;font-size:1.35cqw;color:#A8B6CF;line-height:1.35;white-space:nowrap}
  .meta b{color:#fff;font-weight:600}
  .cols,.row{display:grid;grid-template-columns:calc(var(--fs)*1.8) minmax(0,1fr) calc(var(--fs)*3.6) calc(var(--fs)*3.1) calc(var(--fs)*3.2) calc(var(--fs)*3.2) calc(var(--fs)*2.6) calc(var(--fs)*2.6) calc(var(--fs)*3.1);column-gap:calc(var(--fs)*.6);align-items:center}
  .cols{white-space:nowrap;font-size:max(.85cqw,calc(var(--fs)*.5));text-transform:uppercase;letter-spacing:.1em;color:#7F8FAD;font-weight:600;padding:0 calc(var(--fs)*.7)}
  .cols span:nth-child(n+3){text-align:right}.cols span:nth-child(6){text-align:left}
  .rows{display:flex;flex-direction:column;gap:calc(var(--fs)*.22);flex:1;min-height:0}
  .row{background:rgba(255,255,255,.05);border-radius:calc(var(--fs)*.35);padding:0 calc(var(--fs)*.7);flex:1 1 0;min-height:0;max-height:calc(var(--fs)*3.2);overflow:hidden;line-height:1.2}
  .row.first{background:linear-gradient(90deg,rgba(246,178,33,.28),rgba(246,178,33,.06));box-shadow:inset 0 0 0 .15cqw rgba(246,178,33,.7)}
  .row.stale{opacity:.5}
  .rank{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:calc(var(--fs)*1.2);color:#7F8FAD;text-align:center}
  .first .rank{color:#F6B221}
  .store{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:700;font-size:calc(var(--fs)*1.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .store small{font-family:"Segoe UI",sans-serif;font-weight:500;font-size:calc(var(--fs)*.55);color:#8E9CB6;letter-spacing:.03em;margin-left:calc(var(--fs)*.45)}
  .time{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:calc(var(--fs)*1.25);font-variant-numeric:tabular-nums;text-align:right}
  .dp,.cars,.live{font-size:calc(var(--fs)*.9);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:#C9D3E4}
  .live{color:#fff;font-weight:700}
  .bar{position:relative;height:calc(var(--fs)*.42);background:rgba(255,255,255,.08);border-radius:1cqw}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:1cqw;transition:width .8s ease}
  .vsbec{font-size:calc(var(--fs)*.9);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .ahead{color:#4AD68A}.behind{color:#FF8A9A}.even{color:#C9D3E4}
  .bar .bec{position:absolute;top:calc(var(--fs)*-.3);bottom:calc(var(--fs)*-.3);width:.35cqw;margin-left:-.175cqw;background:#F6B221;border-radius:.2cqw}
  .becbox{display:flex;align-items:center;gap:1.4cqw;background:rgba(246,178,33,.12);border:.15cqw solid rgba(246,178,33,.55);border-radius:1cqw;padding:.5cqw 1.4cqw}
  .becbox .lbl{font-size:1.05cqw;letter-spacing:.14em;text-transform:uppercase;color:#F6C46A;font-weight:700;line-height:1.25}
  .becbox .lbl small{display:block;white-space:nowrap;letter-spacing:.02em;text-transform:none;color:#A8B6CF;font-weight:500;font-size:1.05cqw}
  .becbox .num{font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:3.2cqw;line-height:.9;font-variant-numeric:tabular-nums}
  .bar .goal{position:absolute;top:calc(var(--fs)*-.22);bottom:calc(var(--fs)*-.22);width:.18cqw;background:#fff;opacity:.8}
  .flash{animation:flash 1.2s ease-out}
  @keyframes flash{0%{text-shadow:0 0 1.2cqw #F6B221;transform:scale(1.12)}100%{text-shadow:none;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.flash{animation:none}}
  .dotlive{display:inline-block;width:.8cqw;height:.8cqw;border-radius:50%;background:#34C77B;margin-right:.5cqw;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .cars{font-size:calc(var(--fs)*.9);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:#C9D3E4}
  .good{color:#4AD68A}.warn{color:#F4BC4C}.bad{color:#FF6B7E}
  .b-good{background:#34C77B}.b-warn{background:#F4BC4C}.b-bad{background:#FF5A70}
  .foot{display:flex;gap:2.4cqw;font-size:1.15cqw;color:#8E9CB6;align-items:center}
  .foot i{display:inline-block;width:1cqw;height:1cqw;border-radius:.3cqw;margin-right:.5cqw;vertical-align:-.1cqw}
  .foot .sp{flex:1}
  .offline{position:absolute;left:50%;top:1.2cqw;transform:translateX(-50%);background:#FF5A70;color:#fff;font-weight:700;font-size:1.2cqw;padding:.4cqw 1.2cqw;border-radius:2cqw;display:none}
</style>
</head>
<body>
<div class="tv"><div class="lb">
  <div class="head"><div class="title" id="title">Drive-Thru<br><span>Showdown</span></div><div class="becbox" id="bec"><div class="num" id="becNum">--</div><div class="lbl">BEC average<small id="becSub">car-weighted · waiting for stores</small></div></div><div class="meta" id="meta">Connecting…</div></div>
  <div class="cols"><span>#</span><span>Store</span><span style="text-align:right">Today</span><span style="text-align:right">vs BEC</span><span style="text-align:right">Daypart</span><span>vs. goal</span><span style="text-align:right">Cars</span><span style="text-align:right">In line</span><span style="text-align:right">Window</span></div>
  <div class="rows" id="rows"></div>
  <div class="foot"><span><i class="b-good"></i>At or under goal</span><span><i class="b-warn"></i>Within 30 sec</span><span><i class="b-bad"></i>Over by 30+ sec</span><span><i style="background:#F6B221;width:.35cqw"></i>BEC average</span><span class="sp"></span><span id="src"><i class="dotlive"></i>Live from Berry AI</span></div>
</div><div class="offline" id="offline">Feeder not responding</div></div>
<script>
const fmt=s=>s==null?"--":Math.floor(s/60)+":"+String(Math.round(s)%60).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STALE=2*60*1000;const prev={};
async function tick(){
  try{
    const r=await fetch("/api/live",{cache:"no-store"});const d=await r.json();
    document.getElementById("offline").style.display="none";render(d);
  }catch(e){document.getElementById("offline").style.display="block"}
}
function render(d){
  const g=d.goalSeconds;const now=Date.now();
  const band=v=>v==null?"":v<=g?"good":v<=g+30?"warn":"bad";
  const stores=d.stores.map(s=>({...s,age:s.updatedAt?now-Date.parse(s.updatedAt):Infinity}));
  stores.sort((a,b)=>(a.todayAvg??9e9)-(b.todayAvg??9e9));
  const max=Math.max(g+120,...stores.map(s=>s.todayAvg||0));
  // BEC number: every car counts once (total seconds / total cars), not an average of store averages.
  // Stores with no cars yet, or no update in 20 minutes, are left out.
  const inBec=stores.filter(s=>s.todayAvg!=null&&s.todayCars>0&&s.age<20*60*1000);
  const becCars=inBec.reduce((a,s)=>a+s.todayCars,0);
  const bec=becCars?inBec.reduce((a,s)=>a+s.todayAvg*s.todayCars,0)/becCars:null;
  const becEl=document.getElementById("becNum");const bt=fmt(bec);
  const changed=becEl.textContent!==bt&&becEl.textContent!=="--";
  becEl.textContent=bt;becEl.className="num "+(bec==null?"":band(bec));
  if(changed){void becEl.offsetWidth;becEl.classList.add("flash")}
  document.getElementById("becSub").textContent=bec==null?"car-weighted · waiting for stores":`${becCars.toLocaleString()} cars · ${inBec.length} of ${stores.length} stores`;
  const vs=s=>{if(bec==null||s.todayAvg==null)return'<div class="vsbec">--</div>';const d=Math.round(s.todayAvg-bec);
    return `<div class="vsbec ${d<0?"ahead":d>0?"behind":"even"}">${d===0?"even":(d<0?"\u2212":"+")+fmt(Math.abs(d))}</div>`};
  const last=Math.max(0,...stores.filter(s=>s.updatedAt).map(s=>Date.parse(s.updatedAt)));
  const dp=(stores.find(s=>s.daypart)||{}).daypart||"";
  document.getElementById("meta").innerHTML=`Avg total time today${dp?" · "+esc(dp.replace(/\s*\(.*\)/,"")):""}<br>Goal <b>${fmt(g)}</b> · updated <b>${last?new Date(last).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"--"}</b>`;
  // size everything to fit the number of stores
  const N=stores.length, lb=document.querySelector(".lb");
  const compact=N>7;
  lb.style.setProperty("--title",compact?"3.6cqw":"5.4cqw");
  document.getElementById("title").innerHTML=compact?'Drive-Thru <span>Showdown</span>':'Drive-Thru<br><span>Showdown</span>';
  // size rows from the height actually left on screen, so every row fits without clipping
  const rowsEl=document.getElementById("rows"),cq=document.querySelector(".tv").clientWidth/100;
  const fit=()=>{const h=rowsEl.clientHeight;if(!h||!cq)return;
    const fs=Math.min(2.2,h/(N*1.72)/cq); // each row needs about 1.5 x font size, plus the gap
    lb.style.setProperty("--fs",fs.toFixed(3)+"cqw")};
  document.getElementById("rows").innerHTML=stores.map((s,i)=>{const b=band(s.todayAvg);const stale=s.age>STALE;
    return `<div class="row ${i===0&&s.todayAvg!=null?"first":""} ${stale?"stale":""}">
      <div class="rank">${i+1}</div>
      <div class="store">${esc(s.name)}<small>${s.num?"#"+esc(s.num):""}${stale?(s.updatedAt?" · no update "+Math.round(s.age/60000)+"m":" · waiting"):""}</small></div>
      <div class="time ${b}" data-k="${esc(s.code)}-t">${fmt(s.todayAvg)}</div>
      ${vs(s)}
      <div class="dp ${band(s.daypartAvg)}">${fmt(s.daypartAvg)}</div>
      <div class="bar">${s.todayAvg!=null?`<i class="b-${b}" style="width:${(s.todayAvg/max*100).toFixed(1)}%"></i>`:""}<span class="goal" style="left:${(g/max*100).toFixed(1)}%"></span>${bec!=null?`<span class="bec" style="left:${(bec/max*100).toFixed(1)}%"></span>`:""}</div>
      <div class="cars" data-k="${esc(s.code)}-cars">${s.todayCars??"--"}</div>
      <div class="live" data-k="${esc(s.code)}-q">${s.queue??"--"}</div>
      <div class="live ${s.windowNow!=null&&s.windowGoal?(s.windowNow<=s.windowGoal?"good":s.windowNow<=s.windowGoal+30?"warn":"bad"):""}" data-k="${esc(s.code)}-w">${s.windowNow?fmt(s.windowNow):"--"}</div>
    </div>`}).join("");
  fit();requestAnimationFrame(fit);
  // flash any number that changed since the last refresh
  document.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k,v=el.firstChild?el.firstChild.textContent:"";
    if(prev[k]!==undefined&&prev[k]!==v){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}prev[k]=v});
}
tick();setInterval(tick,3000);
// pick up new versions on their own: if this page changes on the server, reload it (checked every 5 minutes)
(()=>{const files=["/board.html"];let base=null;
const sig=async()=>{const t=await Promise.all(files.map(f=>fetch(f,{cache:"no-store"}).then(r=>r.ok?r.text():"")));
  if(t.some(x=>!x))return null;return t.map(x=>x.length+":"+[...x].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,0)).join("|")};
sig().then(s=>{base=s}).catch(()=>{});
setInterval(async()=>{try{const s=await sig();if(!s)return;if(base===null)base=s;else if(s!==base)location.reload()}catch(e){}},5*60*1000);})();
</script>
<script>
// Daypart Races panel for the Drive-Thru Showdown: each daypart is its own race.
// Finished dayparts show their winner; the current daypart shows a live race. Keeps the all-day board running.
(() => {
  const DP = { 1: "Open", 2: "Lunch", 3: "Afternoon", 4: "Dinner", 5: "Late", 6: "Late Night" };
  // Daypart 6 (Late Night, 10p–close) is only raced on Friday and Saturday (Eastern)
  const isLateNightDay = () => /^(Fri|Sat)/.test(new Date().toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short" }));
  const etHour = () => +new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", hourCycle: "h23" }).format(new Date());
  const MIN_CARS = 5; // a store needs this many cars in a daypart to win it
  const fmt = s => { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const css = document.createElement("style");
  css.textContent = `
  .dpwrap{flex:1;min-height:0;display:flex;gap:1.6cqw}
  .dpmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.6cqw}
  .dpside{width:25cqw;flex:none;display:flex;flex-direction:column;gap:.7cqw;min-height:0}
  .dph{display:flex;align-items:baseline;justify-content:space-between}
  .dph b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.9cqw;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .dph b span{color:#F6B221}
  .dph small{white-space:nowrap;font-size:.85cqw;color:#7F8FAD;letter-spacing:.1em;text-transform:uppercase}
  .dpc{border-radius:.9cqw;background:rgba(255,255,255,.05);border:.12cqw solid rgba(255,255,255,.08);padding:.55cqw .9cqw;display:grid;grid-template-columns:6.6cqw 1fr auto;align-items:center;gap:.6cqw}
  .dpc .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.35cqw;text-transform:uppercase;letter-spacing:.05em;color:#A8B6CF}
  .dpc .nm small{display:block;white-space:nowrap;font-family:"Barlow",sans-serif;font-weight:600;font-size:.8cqw;letter-spacing:.08em;color:#6F7F9C}
  .dpc .w{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dpc .t{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.9cqw;font-variant-numeric:tabular-nums}
  .dpc.done{border-color:rgba(246,178,33,.45);background:linear-gradient(90deg,rgba(246,178,33,.16),rgba(255,255,255,.03))}
  .dpc.done .t{color:#F6C46A}
  .dpc.soon{opacity:.5}
  .dpc.soon .w{color:#7F8FAD;font-weight:600;font-size:1.25cqw}
  .dplive{border-radius:1cqw;border:.16cqw solid #4CC778;background:rgba(76,199,120,.08);padding:.7cqw .9cqw;display:flex;flex-direction:column;gap:.35cqw;flex:1;min-height:0}
  .dplive .top{display:flex;justify-content:space-between;align-items:baseline}
  .dplive .top b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.7cqw;text-transform:uppercase;letter-spacing:.05em}
  .dplive .top small{font-size:.9cqw;color:#A8B6CF}
  .dplive .pill{display:inline-block;background:#4CC778;color:#0B1426;font-weight:800;font-size:.85cqw;letter-spacing:.12em;padding:.1cqw .5cqw;border-radius:.4cqw;margin-right:.5cqw;vertical-align:.25cqw;animation:dppulse 1.6s ease-in-out infinite}
  @keyframes dppulse{50%{opacity:.45}}
  .dplive .r{display:grid;grid-template-columns:1.8cqw 1fr auto;gap:.5cqw;align-items:center;font-size:1.35cqw}
  .dplive .r .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:#7F8FAD}
  .dplive .r .s{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dplive .r .v{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.6cqw;font-variant-numeric:tabular-nums}
  .dplive .r.lead .n,.dplive .r.lead .v{color:#4CC778}
  .dplive .r.lead .s::after{content:" ◀ leading";font-size:.75em;color:#4CC778;font-weight:700}
  .dplive .gap{font-size:.95cqw;color:#A8B6CF;margin-top:auto}
  .dpcrown{border-radius:1cqw;padding:.6cqw .9cqw;background:linear-gradient(90deg,rgba(246,178,33,.28),rgba(246,178,33,.08));border:.16cqw solid #F6B221;display:grid;grid-template-columns:auto 1fr auto;gap:.7cqw;align-items:center}
  .dpcrown .ic{font-size:2.4cqw;line-height:1}
  .dpcrown .l{font-size:.85cqw;letter-spacing:.14em;text-transform:uppercase;color:#F6C46A;font-weight:700}
  .dpcrown .w{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.8cqw;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dpcrown .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.5cqw;color:#F6C46A;white-space:nowrap}
  .dpcrown.tie .w{white-space:normal;font-size:1.45cqw;line-height:1.1}
  .dpcrown.none .w{color:#7F8FAD;font-weight:600;font-size:1.3cqw}
  .head{gap:1cqw}
  .wkchip{flex:0 1 auto;min-width:0;max-width:21cqw;border-radius:1cqw;border:.14cqw solid rgba(246,178,33,.55);background:rgba(246,178,33,.08);padding:.4cqw .8cqw;display:flex;flex-direction:row;gap:.9cqw;margin-left:auto}
  .wkchip .ln{display:flex;flex-direction:column;align-items:flex-start;gap:.1cqw;min-width:0;white-space:nowrap;overflow:hidden}
  .wkchip .k{font-size:.7cqw;letter-spacing:.12em;text-transform:uppercase;color:#F6C46A;font-weight:700}
  .wkchip .v{max-width:100%;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3cqw;overflow:hidden;text-overflow:ellipsis}
  .wkchip .v i{font-style:normal;color:#F6C46A;margin-left:.35cqw}
  .wkchip .gg{display:inline-block;filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.15) drop-shadow(0 0 .25cqw rgba(246,178,33,.6));margin-right:.1cqw}
  .wkchip .v.ch{color:#CFE3E8;font-size:1.15cqw}
  .wkchip .v.dim{color:#7F8FAD;font-weight:600;font-size:1.05cqw}
  .dpside.six{gap:.5cqw}
  .dpside.six .dpc{padding:.35cqw .9cqw}
  .dpside.six .dpc .t{font-size:1.7cqw}
  .dpside.six .dplive{padding:.5cqw .9cqw;gap:.2cqw}
  .wkchip{flex:0 0 auto;max-width:36cqw}
  .dp .q{font-size:.6em;font-weight:700;color:#7F8FAD;margin-left:.25em;letter-spacing:.02em}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .dpside{overflow:hidden}
  .dplive{flex:1 1 auto;overflow:hidden}
  .dpside.six .dplive .r{font-size:1.25cqw}
  .dpside.six .dplive .r .v{font-size:1.45cqw}
  .dpside.six .dplive .gap{font-size:.85cqw}
  .dpwins{display:inline-block;margin-left:.6cqw;font-size:.62em;color:#F6C46A;vertical-align:.1em;white-space:nowrap}
  `;
  document.head.appendChild(css);

  // Wrap the existing board (column headers + rows) and add the side panel
  const lb = document.querySelector(".lb"), cols = document.querySelector(".cols"), rows = document.getElementById("rows");
  const wrap = document.createElement("div"); wrap.className = "dpwrap";
  const main = document.createElement("div"); main.className = "dpmain";
  const side = document.createElement("div"); side.className = "dpside";
  const allday = document.createElement("div"); allday.className = "dph allday";
  allday.innerHTML = `<b>Fastest <span>All Day</span></b><small>Ranked by today’s average · crown goes to most daypart wins →</small>`;
  cols.before(wrap); main.append(allday, cols, rows); wrap.append(main, side);

  const cur = d => { const m = /Daypart\s+(\d)/.exec((d.stores.find(s => s.daypart) || {}).daypart || ""); return m ? +m[1] : 0; };
  const HRS = { 1: "Open–11a", 2: "11a–2p", 3: "2p–5p", 4: "5p–8p", 5: "8p–Close", 6: "10p–Close" };
  const short = n => n.replace(/^N\. Charleston /, "").replace(/^Charleston /, "");

  function drawSide(d) {
    const N = isLateNightDay() ? 6 : 5, hrs = n => (N === 6 && n === 5 ? "8p–10p" : HRS[n]);
    const c0 = cur(d), c = c0 >= N && etHour() >= 23 ? N + 1 : c0, wins = {}; // after 11 PM the last race is final
    const race = n => d.stores.map(s => ({ s, p: (s.dayparts || []).find(x => x.dp === n) }))
      .filter(x => x.p && x.p.t && x.p.cars >= MIN_CARS).sort((a, b) => (Math.round(a.p.t) - Math.round(b.p.t)) || (b.p.cars - a.p.cars)) // tie: more cars wins;
    let html = `<div class="dph"><b>Daypart <span>Races</span></b></div><!--crown-->`;
    for (let n = 1; n <= N; n++) {
      const r = race(n);
      if (n < c && r[0]) {
        wins[r[0].s.code] = (wins[r[0].s.code] || 0) + 1;
        const gs = r[1] ? Math.round(r[1].p.t) - Math.round(r[0].p.t) : null, gap = gs === null ? "" : gs === 0 ? " · tie, more cars" : ` by ${gs}s`;
        html += `<div class="dpc done"><div class="nm">${DP[n]}<small>Won${gap}</small></div><div class="w">${esc(short(r[0].s.name))}</div><div class="t">${fmt(r[0].p.t)}</div></div>`;
      } else if (n === c) {
        const top = r.slice(0, 3);
        html += `<div class="dplive"><div class="top"><b><span class="pill">LIVE</span>${DP[n]}</b><small>${hrs(n)}</small></div>` +
          (top.length ? top.map((x, i) => `<div class="r${i === 0 ? " lead" : ""}"><span class="n">${i + 1}</span><span class="s">${esc(short(x.s.name))}</span><span class="v">${fmt(x.p.t)}</span></div>`).join("")
            : `<div class="r"><span></span><span class="s" style="color:#A8B6CF">Waiting for ${MIN_CARS} cars per store…</span><span></span></div>`) +
          (top[1] ? `<div class="gap">${esc(short(top[1].s.name))} is ${Math.round(top[1].p.t) - Math.round(top[0].p.t)}s behind the lead</div>` : "") + `</div>`;
      } else if (n < c) {
        html += `<div class="dpc"><div class="nm">${DP[n]}</div><div class="w" style="color:#7F8FAD">No winner</div><div class="t"></div></div>`;
      } else {
        html += `<div class="dpc soon"><div class="nm">${DP[n]}</div><div class="w">Up next · ${hrs(n)}</div><div class="t"></div></div>`;
      }
    }
    // Day crown: most daypart wins; a tie goes to the faster all-day time
    const ranked = Object.entries(wins).map(([code, n]) => ({ s: d.stores.find(x => x.code === code), n }))
      .sort((a, b) => (b.n - a.n) || ((a.s.todayAvg || 9e9) - (b.s.todayAvg || 9e9)));
    const final = c === 0 || c > N;
    // While the day is still running, a shared lead shows as a tie with every store in it
    const top = ranked[0] ? ranked.filter(x => x.n === ranked[0].n) : [];
    const tied = !final && top.length > 1;
    const names = tied ? top.map(x => esc(short(x.s.name))) : [];
    const tieNames = names.length > 1 ? names.slice(0, -1).join(", ") + " &amp; " + names[names.length - 1] : "";
    const crown = tied ? `<div class="dpcrown tie"><span class="ic">👑</span><div><div class="l">Tied for the crown</div><div class="w">${tieNames}</div></div><span class="n">${ranked[0].n} ${ranked[0].n === 1 ? "win" : "wins"} each</span></div>`
      : ranked[0] ? `<div class="dpcrown"><span class="ic">👑</span><div><div class="l">${final ? "Crown of the day" : "Leading for the crown"}</div><div class="w">${esc(short(ranked[0].s.name))}</div></div><span class="n">${ranked[0].n} ${ranked[0].n === 1 ? "win" : "wins"}</span></div>`
      : `<div class="dpcrown none"><span class="ic">👑</span><div><div class="l">Crown of the day</div><div class="w">Most daypart wins takes it</div></div><span></span></div>`;
    side.classList.toggle("six", N === 6);
    side.innerHTML = html.replace("<!--crown-->", crown);
    wins.__crown = ranked[0] && !tied ? ranked[0].s.code : null;
    return wins;
  }

  // Fill the board's Daypart column with each store's current-daypart time, and show daypart wins next to names
  function patchRows(d, wins) {
    const c = cur(d);
    document.querySelectorAll("#rows .row").forEach(row => {
      const st = row.querySelector(".store"); if (!st) return;
      const num = (st.querySelector("small") || {}).textContent || "";
      const s = d.stores.find(x => num.includes(x.num)); if (!s) return;
      const p = (s.dayparts || []).find(x => x.dp === c), dp = row.querySelector(".dp");
      if (dp && p && p.t) {
        if (p.cars < MIN_CARS) { dp.innerHTML = `${fmt(p.t)}<span class="q">${p.cars}/${MIN_CARS}</span>`; dp.style.color = "#6F7F9C"; } // not in the race yet
        else { dp.textContent = fmt(p.t); dp.style.color = p.t <= d.goalSeconds ? "#4CC778" : p.t <= d.goalSeconds + 30 ? "#F6B221" : "#F26B5E"; }
      }
      st.querySelectorAll(".dpwins").forEach(e => e.remove());
      if (wins[s.code]) st.insertAdjacentHTML("beforeend", `<span class="dpwins">${wins.__crown === s.code ? "👑" : ""}${"🏆".repeat(wins[s.code])}</span>`);
    });
  }


  // ---- Weekly goat: points Mon–Sun (Eastern). Each day: daypart win 1, crown 2, fastest all day 2.
  // Past days come from /showdown-history.json (recorded on the server); today counts live, so the race moves during the day.
  const PTS = { win: 1, crown: 2, fast: 2 };
  let HIST = null, LIVE = null;
  const loadHist = () => fetch("/showdown-history.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(h => { HIST = h; }).catch(() => {});
  loadHist().then(() => { try { drawWeek(); } catch (e) {} }); setInterval(loadHist, 5 * 60 * 1000);
  const etDate = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const addDays = (iso, n) => { const t = new Date(iso + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const mondayOf = iso => addDays(iso, -((new Date(iso + "T12:00:00Z").getUTCDay() + 6) % 7));
  function addDay(t, day) { // day = { wins, crown, stores: { code: { name, avg, cars } } }
    const st = Object.entries(day.stores || {}).filter(([, x]) => x.avg && x.cars > 0);
    const fast = st.slice().sort((a, b) => a[1].avg - b[1].avg)[0];
    for (const [code, x] of st) {
      const r = t[code] = t[code] || { code, name: x.name, pts: 0, crowns: 0, wins: 0, fast: 0, secs: 0, cars: 0 };
      r.name = x.name; r.secs += x.avg * x.cars; r.cars += x.cars;
      const w = (day.wins || {})[code] || 0; r.wins += w; r.pts += w * PTS.win;
      if (day.crown === code) { r.crowns++; r.pts += PTS.crown; }
      if (fast && fast[0] === code) { r.fast++; r.pts += PTS.fast; }
    }
  }
  function weekTally(from, to, withLive) { // finished days from..to inclusive, plus today's live standings if asked
    const t = {}, days = (HIST && HIST.days) || {};
    for (let k = from; k <= to; k = addDays(k, 1)) { const day = days[k]; if (day && day.final) addDay(t, day); }
    if (withLive && LIVE) addDay(t, LIVE);
    const avg = x => x.cars ? x.secs / x.cars : 9e9;
    return Object.values(t).filter(x => x.pts).sort((a, b) => (b.pts - a.pts) || (b.crowns - a.crowns) || (b.wins - a.wins) || (avg(a) - avg(b)));
  }
  const chip = document.createElement("div"); chip.className = "wkchip";
  const bec = document.getElementById("bec"); if (bec) bec.before(chip);
  function drawWeek() {
    const today = etDate(), mon = mondayOf(today);
    const wk = weekTally(mon, addDays(today, -1), true);
    const lastWk = weekTally(addDays(mon, -7), addDays(mon, -1), false);
    const champ = lastWk[0] || null, lead = wk[0];
    const chase = wk.slice(1, champ ? 3 : 4);
    window.__goat = lead ? { name: short(lead.name), pts: lead.pts, next: chase.map(x => ({ name: short(x.name), pts: x.pts })) } : null;
    chip.innerHTML =
      `<div class="ln"><span class="k">Goat race</span>` +
      (lead ? `<span class="v">${esc(short(lead.name))}<i><span class="gg">🐐</span>${lead.pts} pts</i></span>` : `<span class="v dim">Points start today</span>`) + `</div>` +
      (chase.length ? `<div class="ln"><span class="k">Chasing</span><span class="v ch">${chase.map(x => `${esc(short(x.name))} ${x.pts}`).join(" · ")}</span></div>` : "") +
      (champ ? `<div class="ln"><span class="k">🏆 Last week</span><span class="v">${esc(short(champ.name))}<i><span class="gg">🐐</span></i></span></div>` : "");
  }

  const base = render;
  render = function (d) {
    base(d);
    try {
      const wins = drawSide(d); patchRows(d, wins);
      const w = {}; for (const k in wins) if (k !== "__crown") w[k] = wins[k];
      LIVE = { wins: w, crown: wins.__crown, stores: Object.fromEntries(d.stores.filter(s => s.todayAvg && s.todayCars > 0).map(s => [s.code, { name: s.name, avg: s.todayAvg, cars: s.todayCars }])) };
      drawWeek();
    } catch (e) { console.warn("dayparts", e); }
  };
  fetch("/api/live", { cache: "no-store" }).then(r => r.json()).then(d => render(d)).catch(() => {});
})();
</script>
<script>
// Showdown extras: deep slate theme, race-alert ticker, and row movement flashes.
(() => {
  const fmt = s => { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const short = n => n.replace(/^N\. Charleston /, "").replace(/^Charleston /, "");
  const DP = { 1: "Open", 2: "Lunch", 3: "Afternoon", 4: "Dinner", 5: "Late", 6: "Late Night" };
  const lateNight = () => /^(Fri|Sat)/.test(new Date().toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short" }));
  const END = () => ({ 1: 11, 2: 14, 3: 17, 4: 20, 5: lateNight() ? 22 : 23, 6: 23 }); // hour each race ends (Eastern)

  // Barlow fonts (the board asked for them but never loaded them)
  const fl = document.createElement("link"); fl.rel = "stylesheet";
  fl.href = "https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap";
  document.head.appendChild(fl);

  const css = document.createElement("style");
  css.textContent = `
  html,body{background:#071318}
  .lb{background:radial-gradient(120% 90% at 100% 0%,#14424F 0%,#0B2229 55%,#081A20 100%)!important;font-family:"Barlow","Segoe UI",sans-serif}
  .title span,.dph b span{color:#F6B221!important}
  .row{background:rgba(255,255,255,.055)!important;transition:transform .6s ease}
  .becbox{background:rgba(64,196,190,.10)!important;border-color:rgba(64,196,190,.6)!important}
  .becbox .lbl{color:#7FE3DC!important}
  .cols,.rank,.store small,.meta{color:#8FB0B8!important}
  .dpc{background:rgba(255,255,255,.05)!important}
  /* movement */
  @keyframes mvUp{0%{box-shadow:inset 0 0 0 .2cqw #4CD68A,0 0 1.6cqw rgba(76,214,138,.7);background:rgba(76,214,138,.28)}100%{box-shadow:none}}
  @keyframes mvDn{0%{box-shadow:inset 0 0 0 .2cqw #F26B5E,0 0 1.2cqw rgba(242,107,94,.6);background:rgba(242,107,94,.22)}100%{box-shadow:none}}
  .row.mv-up{animation:mvUp 3s ease-out 2}
  .row.mv-dn{animation:mvDn 3s ease-out 1}
  .mvtag{display:inline-block;margin-left:.5cqw;font-size:.55em;font-weight:800;vertical-align:.15em;padding:0 .35cqw;border-radius:.3cqw}
  .mvtag.up{color:#0B2229;background:#4CD68A}.mvtag.dn{color:#fff;background:#D9534F}
  /* ticker */
  .tick{flex:none;display:flex;justify-content:center;min-width:0}
  .tick .msg{display:inline-flex;align-items:center;gap:.7cqw;max-width:100%;padding:.35cqw 1.2cqw;border-radius:99px;background:rgba(246,178,33,.12);border:.12cqw solid rgba(246,178,33,.55);color:#FFF4DA;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.55cqw;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .5s,transform .5s}
  .tick .msg.out{opacity:0;transform:translateY(.6cqw)}
  .tick .msg b{color:#F6B221;font-weight:800}
  .tick .lv{font-family:"Barlow",sans-serif;font-size:.75cqw;font-weight:800;letter-spacing:.14em;color:#0B2229;background:#F6B221;border-radius:.3cqw;padding:.05cqw .45cqw}
  `;
  document.head.appendChild(css);

  // Ticker sits under the store list (inside the main column, so the Daypart Races panel keeps its height)
  const tick = document.createElement("div"); tick.className = "tick";
  tick.innerHTML = `<span class="msg"><span class="lv">LIVE</span><span class="tx">Race alerts loading…</span></span>`;
  (document.querySelector(".dpmain") || document.querySelector(".lb")).appendChild(tick);
  const msgEl = tick.querySelector(".msg"), txEl = tick.querySelector(".tx");

  let msgs = [], mi = 0;
  function buildMsgs(d) {
    const out = [], stores = d.stores.filter(s => s.todayAvg);
    const m = /Daypart\s+(\d)/.exec((d.stores.find(s => s.daypart) || {}).daypart || ""); const c = m ? +m[1] : 0;
    const race = stores.map(s => ({ s, p: (s.dayparts || []).find(x => x.dp === c) })).filter(x => x.p && x.p.t && x.p.cars >= 5).sort((a, b) => (Math.round(a.p.t) - Math.round(b.p.t)) || (b.p.cars - a.p.cars)) // tie: more cars wins;
    if (race[1]) out.push(`🔥 <b>${esc(short(race[0].s.name))}</b> leads the ${DP[c]} race by ${Math.round(race[1].p.t) - Math.round(race[0].p.t)} sec`);
    for (let i = 1; i < Math.min(race.length, 5); i++) {
      const g = Math.round(race[i].p.t) - Math.round(race[i - 1].p.t);
      if (g <= 6) { out.push(`⚡ Tight race: <b>${esc(short(race[i].s.name))}</b> is ${g} sec behind ${esc(short(race[i - 1].s.name))} for #${i} in ${DP[c]}`); break; }
    }
    if (c && END()[c]) {
      const now = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
      const left = (END()[c] * 60) - (now.getHours() * 60 + now.getMinutes());
      if (left > 0 && left <= 180) out.push(`⏱ ${DP[c]} race ends in <b>${Math.floor(left / 60) ? Math.floor(left / 60) + " hr " : ""}${left % 60} min</b> — every car counts`);
    }
    const all = [...stores].sort((a, b) => a.todayAvg - b.todayAvg);
    if (all[0]) out.push(`🏁 <b>${esc(short(all[0].name))}</b> is fastest all day at ${fmt(all[0].todayAvg)}`);
    const g = window.__goat;
    if (g) out.push(g.next[0] && g.next[0].pts === g.pts ? `🐐 <b>${esc(g.name)}</b> and <b>${esc(g.next[0].name)}</b> are tied for the goat lead at ${g.pts} pts` : `🐐 <b>${esc(g.name)}</b> leads the goat race with ${g.pts} pts` + (g.next[0] ? ` · ${esc(g.next[0].name)} has ${g.next[0].pts}` : ""));
    out.push(`🐐 Goat points: <b>Daypart win 1</b> · <b>Crown 2</b> · <b>Fastest all day 2</b>`);
    const goal = d.goalSeconds, under = stores.filter(s => s.todayAvg <= goal).length;
    if (goal) out.push(`🎯 <b>${under} of ${stores.length}</b> stores are at or under the ${fmt(goal)} goal today`);
    if (window.__dpMoves && window.__dpMoves.length) out.push(...window.__dpMoves.map(x => x.up ? `📈 <b>${esc(short(x.name))}</b> just climbed to #${x.to}` : `📉 ${esc(short(x.name))} slipped to #${x.to}`));
    return out;
  }
  function rotate() {
    if (!msgs.length) return;
    msgEl.classList.add("out");
    setTimeout(() => { txEl.innerHTML = msgs[mi++ % msgs.length]; msgEl.classList.remove("out"); }, 500);
  }
  setInterval(rotate, 7000);

  // Row movement: compare each store's place with the last update
  let prev = null; const tagUntil = {};
  function moves() {
    const now = {}, rows = [...document.querySelectorAll("#rows .row")];
    rows.forEach((row, i) => { const k = ((row.querySelector(".store small") || {}).textContent || "").trim(); if (k) now[k] = { i: i + 1, row, name: (row.querySelector(".store").firstChild || {}).textContent || k }; });
    const ev = [];
    if (prev) for (const [k, v] of Object.entries(now)) {
      const p = prev[k]; if (!p || p === v.i) continue;
      const up = v.i < p; tagUntil[k] = { up, n: Math.abs(p - v.i), until: Date.now() + 5 * 60 * 1000 };
      v.row.classList.remove("mv-up", "mv-dn"); void v.row.offsetWidth; v.row.classList.add(up ? "mv-up" : "mv-dn");
      ev.push({ name: v.name.trim(), up, to: v.i });
    }
    for (const [k, v] of Object.entries(now)) {
      const st = v.row.querySelector(".store"); st.querySelectorAll(".mvtag").forEach(e => e.remove());
      const t = tagUntil[k]; if (t && t.until > Date.now()) st.insertAdjacentHTML("beforeend", `<span class="mvtag ${t.up ? "up" : "dn"}">${t.up ? "▲" : "▼"}${t.n}</span>`);
    }
    if (ev.length) window.__dpMoves = ev.filter(e => e.up).slice(0, 2).concat(ev.filter(e => !e.up).slice(0, 1));
    prev = Object.fromEntries(Object.entries(now).map(([k, v]) => [k, v.i]));
  }

  const base = render;
  render = function (d) {
    base(d);
    try { moves(); const first = !msgs.length; msgs = buildMsgs(d); if (first) rotate(); } catch (e) { console.warn("extras", e); }
  };
  fetch("/api/live", { cache: "no-store" }).then(r => r.json()).then(d => render(d)).catch(() => {});
})();
</script>
