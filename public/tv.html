<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap">
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  body{display:flex;align-items:center;justify-content:center;font-family:"Barlow","Segoe UI",sans-serif}
  .tv{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;background:#0B1426;overflow:hidden}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
  .layer.on{opacity:1}
  .layer img,.layer video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  iframe.layer{border:0;width:100%;height:100%}
  .ann{display:flex;flex-direction:column;justify-content:center;padding:6cqw 7cqw;gap:2cqw;background:#C8102E;color:#fff}
  .ann.navy{background:#13233F}.ann.gold{background:#F6B221;color:#13233F}.ann.black{background:#111}
  .ann .tag{font-size:1.4cqw;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.8}
  .ann h1{margin:0;font-family:"Barlow Condensed","Segoe UI",sans-serif;font-weight:800;font-size:7.5cqw;line-height:.95;text-transform:uppercase;text-wrap:balance}
  .ann p{margin:0;font-size:2.8cqw;font-weight:500;max-width:75cqw;line-height:1.3;white-space:pre-line}
  .progress{position:absolute;left:0;bottom:0;height:.35cqw;background:#F6B221;width:0;z-index:5;opacity:.85}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7F8FAD;font-size:2cqw;text-align:center;padding:4cqw}
  @media (prefers-reduced-motion:reduce){.layer{transition:none}}
</style>
</head>
<body>
<div class="tv" id="tv">
  <iframe class="layer" id="lb" src="/board.html" title="Drive-thru leaderboard"></iframe>
  <div class="empty" id="empty" hidden>Loading…</div>
  <div class="progress" id="prog"></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const STORE=(params.get("store")||"all").toUpperCase();
const tv=document.getElementById("tv"),lb=document.getElementById("lb"),prog=document.getElementById("prog"),empty=document.getElementById("empty");
let items=[],idx=-1,timer=null,current=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function forThisStore(list){
  return list.filter(it=>it.active&&(it.stores==="all"||STORE==="ALL"||(Array.isArray(it.stores)&&it.stores.map(s=>s.toUpperCase()).includes(STORE))));
}
let reviewCount=0;
async function refresh(){
  try{const rv=await fetch("/api/reviews?store="+encodeURIComponent(STORE),{cache:"no-store"});reviewCount=(await rv.json()).reviews.length}catch(e){}
  try{const r=await fetch("/api/content",{cache:"no-store"});const d=await r.json();items=forThisStore(d.items).filter(it=>it.type!=="reviews"||reviewCount>0);
    if(!timer)next();
  }catch(e){ if(!items.length){empty.hidden=false;empty.textContent="Can't reach the Store Screens computer. Retrying…"} }
}
function show(el){
  [...tv.querySelectorAll(".layer")].forEach(x=>{if(x!==el)x.classList.remove("on")});
  requestAnimationFrame(()=>el.classList.add("on"));
  // clean up old slides after the fade
  setTimeout(()=>[...tv.querySelectorAll(".layer.slide")].forEach(x=>{if(x!==el){const v=x.querySelector("video");if(v)v.pause();x.remove()}}),900);
}
function next(){
  clearTimeout(timer);timer=null;
  if(!items.length){empty.hidden=false;empty.textContent="Nothing is scheduled for this screen yet. Add content in the dashboard.";timer=setTimeout(next,10000);return}
  empty.hidden=true;
  idx=(idx+1)%items.length;const it=items[idx];current=it;
  let ms=(+it.duration||10)*1000;
  if(it.type==="leaderboard"){show(lb);}
  else{
    const d=document.createElement("div");d.className="layer slide";
    if(it.type==="announcement")d.innerHTML=`<div class="ann ${esc(it.color||"red")}" style="position:absolute;inset:0"><div class="tag">Crew update</div><h1>${esc(it.title)}</h1>${it.body?`<p>${esc(it.body)}</p>`:""}</div>`;
    else if(it.type==="webpage"){
      // render the page on a bigger "virtual screen" and shrink it so the whole page fits with no scrolling
      const z=Math.max(25,Math.min(100,+it.zoom||67))/100;
      d.innerHTML=`<iframe src="${esc(it.url)}" style="position:absolute;left:0;top:0;width:${Math.round(1920/z)}px;height:${Math.round(1080/z)}px;border:0;background:#fff;transform-origin:0 0" referrerpolicy="no-referrer" title="${esc(it.name)}" data-z="${z}"></iframe>`;
    }
    else if(it.type==="reviews")d.innerHTML=`<iframe src="/reviews.html?store=${encodeURIComponent(STORE)}" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#0B1426" title="Google reviews"></iframe>`;
    else if(it.type==="video")d.innerHTML=`<video src="/media/${encodeURIComponent(it.file)}" muted autoplay playsinline ${items.length===1?"loop":""}></video>`;
    else d.innerHTML=`<img src="/media/${encodeURIComponent(it.file)}" alt="">`;
    tv.insertBefore(d,prog);fitFrames();show(d);
    const v=d.querySelector("video");
    if(v){v.play().catch(()=>{});v.addEventListener("error",()=>{clearTimeout(timer);timer=setTimeout(next,1500)});}
  }
  prog.style.transition="none";prog.style.width="0";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{prog.style.transition=`width ${ms}ms linear`;prog.style.width="100%"}));
  timer=setTimeout(next,ms);
}
function fitFrames(){tv.querySelectorAll("iframe[data-z]").forEach(f=>{f.style.transform=`scale(${tv.clientWidth/(1920/+f.dataset.z)})`})}
addEventListener("resize",fitFrames);
refresh();setInterval(refresh,20000);
// keep the screen awake where the browser allows it
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
document.addEventListener("dblclick",()=>{const el=document.documentElement;(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen&&el.requestFullscreen()).catch?.(()=>{})});
</script>
</body>
</html>
